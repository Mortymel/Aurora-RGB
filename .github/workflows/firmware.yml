name: ESP32 Firmware
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'scripts/test_firmware_protocol.cpp'
      - 'scripts/verify_firmware.py'
      - 'web-flasher/**'
      - '.github/workflows/firmware.yml'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO and esptool
        run: python -m pip install platformio 'esptool>=5,<6'
      - name: Test provisioning validation and framing
        run: g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined scripts/test_firmware_protocol.cpp -o /tmp/protocol-test && /tmp/protocol-test
      - name: Compile ESP32-WROOM-32 firmware
        run: pio run -d firmware
      - name: Merge flash image for browser installer
        run: |
          python -m esptool --chip esp32 merge-bin -o web-flasher/firmware.bin --flash-mode dio --flash-freq 40m --flash-size 4MB \
            0x1000 firmware/.pio/build/esp32dev/bootloader.bin \
            0x8000 firmware/.pio/build/esp32dev/partitions.bin \
            0x10000 firmware/.pio/build/esp32dev/firmware.bin
      - name: Verify merged firmware and installer version
        run: |
          python -m esptool --chip esp32 image-info firmware/.pio/build/esp32dev/firmware.bin
          python scripts/verify_firmware.py
          sha256sum web-flasher/firmware.bin > web-flasher/firmware.bin.sha256
      - name: Upload firmware and web installer
        uses: actions/upload-artifact@v4
        with:
          name: Mortys-LED-ESP32-Firmware-Web-Flasher
          path: web-flasher/
          if-no-files-found: error
          retention-days: 30

