name: Aurora Flutter Android
on:
  workflow_dispatch:
  push:
    branches: [main, codex/aurora-flutter-android]
    paths: ['apps/aurora_flutter/**', '.github/workflows/aurora-android.yml']
  pull_request:
    paths: ['apps/aurora_flutter/**', '.github/workflows/aurora-android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/aurora_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          cp pubspec.lock pubspec.lock.saved
          flutter create --platforms=android --org com.mortymel --project-name aurora_led --no-pub .
          mv pubspec.lock.saved pubspec.lock
          python3 scripts/configure_android.py
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build native test APK
        run: flutter build apk --release
      - name: Verify artifact
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$tools_dir/apksigner" verify --verbose "$apk"
          "$tools_dir/aapt" dump badging "$apk" > "$apk.metadata.txt"
          grep -q "com.mortymel.aurora_led" "$apk.metadata.txt"
          grep -q "versionName='1.1.0'" "$apk.metadata.txt"
          sha256sum "$apk" > "$apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Flutter-Android-1.1.0
          path: |
            apps/aurora_flutter/build/app/outputs/flutter-apk/app-release.apk
            apps/aurora_flutter/build/app/outputs/flutter-apk/app-release.apk.sha256
            apps/aurora_flutter/build/app/outputs/flutter-apk/app-release.apk.metadata.txt
          if-no-files-found: error
          retention-days: 30
