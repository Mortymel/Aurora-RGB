name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/configure_android.py'
      - 'scripts/test_android_config.py'
      - 'scripts/verify_apk.py'
      - '.github/workflows/android-apk.yml' 
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Create Android platform files
        run: flutter create --platforms=android --project-name esp32_rgb_studio .
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Test Android configuration
        run: python3 scripts/test_android_config.py
      - name: Apply Android configuration
        run: python3 scripts/configure_android.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
      - name: Test controller LED configuration
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK version, contents and signature
        run: |
          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$tools_dir/aapt" dump badging "$apk" > "$apk.metadata.txt"
          grep -q "versionCode='9' versionName='0.8.0'" "$apk.metadata.txt"
          "$tools_dir/apksigner" verify --verbose --print-certs "$apk" >> "$apk.metadata.txt"
          python3 scripts/verify_apk.py "$apk"
          cp pubspec.lock "$apk.dependencies.lock"
          flutter --version >> "$apk.metadata.txt"
          sha256sum "$apk" > "$apk.sha256"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-RGB-Studio-Android-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
            build/app/outputs/flutter-apk/app-release.apk.metadata.txt
            build/app/outputs/flutter-apk/app-release.apk.dependencies.lock
          if-no-files-found: error
          retention-days: 30

