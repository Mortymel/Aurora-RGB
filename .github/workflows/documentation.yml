name: Documentation checks
on:
  push:
    branches: [main]
    paths: ['**/*.md', 'scripts/check-docs.cjs', '.github/workflows/documentation.yml']
  pull_request:
    paths: ['**/*.md', 'scripts/check-docs.cjs', '.github/workflows/documentation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-docs.cjs

